name: CD Dev (Deploy to Cloud Run)

on:
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize deployments without interrupting a partially deployed environment.
concurrency:
  group: cloud-run-development
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  REPO_NAME: engineer-quest-repo
  BACK_SERVICE: engineer-quest-back-dev
  FRONT_SERVICE: engineer-quest-front-dev

jobs:
  deploy:
    if: >-
      vars.DEV_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: development
      url: ${{ steps.front.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Verify current develop commit passed CI
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.SOURCE_SHA;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'develop' });
            if (branch.commit.sha !== sha) {
              core.notice('Skipping an obsolete develop commit.');
              core.setOutput('deploy', 'false');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: sha,
              branch: 'develop', event: 'push', status: 'success', per_page: 10,
            });
            if (!data.workflow_runs.some(run => run.head_sha === sha && run.conclusion === 'success')) {
              core.setFailed('This develop commit must pass push CI before deployment.');
              return;
            }
            core.setOutput('deploy', 'true');

      - name: Checkout tested commit
        if: steps.eligibility.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Authenticate to GCP
        if: steps.eligibility.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: steps.eligibility.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy development environment
        id: front
        if: steps.eligibility.outputs.deploy == 'true'
        shell: bash
        run: bash .github/scripts/deploy-dev.sh
