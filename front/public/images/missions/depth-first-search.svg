<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">深さ優先探索</title>
  <desc id="desc">分岐した道を奥まで進み、戻りながら探索する図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="32" fill="url(#bg)"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round">
    <path d="M90 180 L210 90 L340 70 L470 130 L555 210"/>
    <path d="M90 180 L220 270 L355 245 L470 130"/>
    <path d="M210 90 L355 245"/>
  </g>
  <path d="M90 180 L210 90 L340 70 L470 130 L555 210" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M535 193 L558 210 L532 225" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke-width="8">
    <circle cx="90" cy="180" r="34" fill="#2563eb" stroke="#1d4ed8"/>
    <circle cx="210" cy="90" r="34" fill="#c4b5fd" stroke="#7c3aed"/>
    <circle cx="340" cy="70" r="34" fill="#c4b5fd" stroke="#7c3aed"/>
    <circle cx="470" cy="130" r="34" fill="#c4b5fd" stroke="#7c3aed"/>
    <circle cx="555" cy="210" r="34" fill="#fde68a" stroke="#d97706"/>
    <circle cx="220" cy="270" r="34" fill="#fff" stroke="#94a3b8"/>
    <circle cx="355" cy="245" r="34" fill="#fff" stroke="#94a3b8"/>
  </g>
  <g font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">
    <text x="90" y="190" fill="#fff">A</text><text x="210" y="100" fill="#3b0764">B</text>
    <text x="340" y="80" fill="#3b0764">D</text><text x="470" y="140" fill="#3b0764">F</text>
    <text x="555" y="220" fill="#78350f">E</text><text x="220" y="280" fill="#334155">C</text>
    <text x="355" y="255" fill="#334155">G</text>
  </g>
  <text x="320" y="335" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#312e81">奥へ進み、行き止まりで一つ前へ戻る</text>
</svg>
